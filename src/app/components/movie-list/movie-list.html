<div class="container">
    @for (movie of movieService.movieList(); track movie.id) {
        <a class="movie-card" [routerLink]="['/', movie.id]">
            <div>
                <img [src]="'https://image.tmdb.org/t/p/original/' + movie.poster_path" [alt]="movie.title" />
            </div>
            <div class="movie-title">
                {{movie.title}}
            </div>
        </a>
    }
</div>
